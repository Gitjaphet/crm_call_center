name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            CLIENT_DIR=/opt/mon-odoo-medevstack/clients/${{ secrets.VPS_CLIENT_DIR }}
            if [ -d "$CLIENT_DIR" ]; then
              cd "$CLIENT_DIR" && git pull
            else
              git clone https://github.com/${{ github.repository }}.git "$CLIENT_DIR"
            fi
            cd /opt/mon-odoo-medevstack && docker compose restart web
